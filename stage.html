<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#120c08" />
    <title>Kakerlaken-Stage</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <header class="stage-top">
      <a class="pill back" href="./" aria-label="Zurück zur App">←</a>
      <div class="pill title">🪳 Stage</div>
      <div class="pill info" id="info">Laufen</div>
    </header>

    <section class="stage-panel" id="panel">
      <div class="row-label">Zustand</div>
      <div class="chips" id="states" role="radiogroup" aria-label="Zustand"></div>

      <div class="row-label">Ansicht</div>
      <div class="chips" id="views" role="group" aria-label="Ansicht"></div>

      <div class="controls">
        <label class="slider">
          <span>Tempo <b id="speed-val">1×</b></span>
          <input id="speed" type="range" min="0.05" max="1" step="0.05" value="1" />
        </label>
        <label class="slider">
          <span>Größe <b id="size-val">Erwachsen</b></span>
          <input id="size" type="range" min="0.45" max="1.15" step="0.05" value="1" />
        </label>
      </div>

      <div class="chips toggles">
        <button class="chip" id="t-spin" aria-pressed="false">Drehteller</button>
        <button class="chip" id="t-ground" aria-pressed="true">Boden</button>
        <button class="chip" id="t-model">Modell: Prozedural</button>
        <label class="chip file">GLB laden…<input id="glb-file" type="file" accept=".glb,.gltf,model/gltf-binary" hidden /></label>
      </div>
    </section>
    <button class="pill panel-toggle" id="panel-toggle" aria-label="Bedienfeld ein/aus">▾</button>

    <script type="module" src="./src/stage.ts"></script>
  </body>
</html>
